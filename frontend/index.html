<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfaf7" />
    <title>PennyTracker — Personal Financial Ledger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400&display=swap" rel="stylesheet" />
    <style>
      html { color-scheme: light; background: #fbfaf7; }
      html[data-theme='dark'] { color-scheme: dark; background: #0c0d0e; }
      @media (prefers-color-scheme: dark) {
        html[data-theme='system'] { color-scheme: dark; background: #0c0d0e; }
      }
    </style>
    <script>
      try {
        const theme = localStorage.getItem('pennytracker-theme')
        document.documentElement.dataset.theme = ['light', 'dark', 'system'].includes(theme) ? theme : 'system'
      } catch {
        document.documentElement.dataset.theme = 'system'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
