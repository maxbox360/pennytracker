<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f5f4" />
    <title>PennyTracker</title>
    <style>
      html { color-scheme: light; background: #f3f5f4; }
      html[data-theme='dark'] { color-scheme: dark; background: #111315; }
      @media (prefers-color-scheme: dark) {
        html[data-theme='system'] { color-scheme: dark; background: #111315; }
      }
    </style>
    <script>
      try {
        const theme = localStorage.getItem('pennytracker-theme')
        document.documentElement.dataset.theme = ['light', 'dark', 'system'].includes(theme) ? theme : 'system'
      } catch {
        document.documentElement.dataset.theme = 'system'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
